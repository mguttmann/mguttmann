# Snake contribution animation for the special profile repo `mguttmann/mguttmann`.
#
# Generates an animated SVG of the GitHub contribution graph "eaten" by a snake
# in the BRONZE palette (github-snake-bronze.svg, the animated hero background
# of the portfolio site) and composes it into header-hero.svg, the banner at
# the top of the profile README. Both are pushed to the shared `output` branch:
#
#   https://raw.githubusercontent.com/mguttmann/mguttmann/output/header-hero.svg
#   https://raw.githubusercontent.com/mguttmann/mguttmann/output/github-snake-bronze.svg
#
# header-hero.svg is the ONLY snake file the README embeds. The former light
# and dark variants (github-contribution-grid-snake.svg / -dark.svg) are no
# longer generated; their last copies stay on `output`, frozen, until a
# maintenance step removes them (the publish is additive and never deletes).
#
# Auth: the workflow uses the built-in `GITHUB_TOKEN` only. No Personal Access
# Token (PAT) is required, because both the contribution read and the push to the
# `output` branch happen inside this same repository. The `contents: write`
# permission is what lets `GITHUB_TOKEN` push the generated branch.
#
# Action references are pinned to the current, actively maintained major tags
# (Platane/snk v3 verified June 2026, latest v3.5.0, Apr 2026; actions/checkout
# v7 and actions/setup-python v7 as in the other workflows). The publish step is the
# local ./.github/actions/publish-output (additive, with a rebase retry against
# concurrent publishers; it replaced crazy-max/ghaction-github-pages v5).
name: Generate Snake Animation

on:
  # Refresh the animation automatically. Every 12 hours keeps the graph current
  # without burning excessive Actions minutes.
  schedule:
    - cron: "0 */12 * * *"

  # Allow manual runs from the Actions tab (useful for the first run / debugging).
  workflow_dispatch:

  # Regenerate when THIS pipeline changes. The animation depends on the
  # contributions, not on the repository content, so an unrelated commit to
  # main does not start a run (it used to start all three output publishers
  # at once).
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - .github/actions/publish-output/**
      - .github/scripts/publish_output.sh
      - .github/scripts/push_with_retry.sh

# Least-privilege: the only mutation this workflow performs is pushing the
# generated SVGs to the `output` branch, which requires write access to repo
# contents. Nothing else is granted.
permissions:
  contents: write

# Serialize overlapping runs of THIS workflow (scheduled + push). The other
# `output` publishers run in their own groups; the publish step's rebase retry
# covers a collision with them. We do NOT cancel in-progress runs, so a running
# generation is allowed to finish rather than being aborted by a quickly
# following trigger.
concurrency:
  group: snake-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Needed for the local publish action (./.github/actions/publish-output).
      # No credentials are persisted: the publish step brings its own token.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Generate the contribution-grid snake animation as SVG. `svg-only` is
      # the faster variant of Platane/snk that skips GIF rendering.
      - name: Generate bronze snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The BRONZE palette recolours the contribution cells into 5 copper
          # intensity steps (empty -> bright) with a bright champagne snake, to
          # match the Executive Dark Luxury theme. The portfolio site uses it as
          # the animated hero background behind the name; the README embeds it
          # only inside header-hero.svg (next step).
          outputs: |
            dist/github-snake-bronze.svg?color_snake=#e6c98f&color_dots=#16161d,#43331f,#6e5430,#9c7a43,#cca066

      # Pinned like every other job that runs python3, so the hero step does
      # not depend on the system Python of the runner image.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Compose the hero banner: overlay the wordmark + tagline on top of the
      # bronze snake, on a solid midnight base (so it reads on BOTH light and
      # dark README themes). This single animated SVG delivers the "snake running
      # behind the name" effect in the README - something markdown CSS cannot do
      # as a live overlay. The portfolio site does the same with real CSS.
      - name: Compose hero banner (snake + wordmark)
        run: |
          cat > "${RUNNER_TEMP}/hero.py" <<'PYEOF'
          import re
          svg = open("dist/github-snake-bronze.svg", encoding="utf-8").read()
          NAME = "Manuel Guttmann"
          TAG = "MICROSOFT 365 &#183; AZURE &#183; SECURITY &#183; AUTOMATION"
          bg = '<rect x="-16" y="-32" width="880" height="192" fill="#0E0E13"/>'
          svg = re.sub(r'(<svg[^>]*>)', r'\1' + bg, svg, count=1)
          overlay = (
              '<defs><radialGradient id="hsScrim" cx="50%" cy="44%" r="62%">'
              '<stop offset="0%" stop-color="#0E0E13" stop-opacity="0.78"/>'
              '<stop offset="58%" stop-color="#0E0E13" stop-opacity="0.34"/>'
              '<stop offset="100%" stop-color="#0E0E13" stop-opacity="0"/>'
              '</radialGradient></defs>'
              '<rect x="-16" y="-32" width="880" height="192" fill="url(#hsScrim)"/>'
              '<text x="424" y="55" text-anchor="middle" dominant-baseline="middle" '
              'font-family="Fraunces,Georgia,\'Times New Roman\',serif" font-weight="600" '
              'font-size="54" letter-spacing="-1" fill="#F3ECDF">' + NAME + '</text>'
              '<text x="424" y="95" text-anchor="middle" dominant-baseline="middle" '
              'font-family="\'JetBrains Mono\',ui-monospace,monospace" font-weight="600" '
              'font-size="15" letter-spacing="3" fill="#C8A06A">' + TAG + '</text>'
          )
          open("dist/header-hero.svg", "w", encoding="utf-8").write(svg.replace("</svg>", overlay + "</svg>", 1))
          print("header-hero.svg written")
          PYEOF
          python3 "${RUNNER_TEMP}/hero.py"
          python3 -c "import xml.dom.minidom as m; m.parse('dist/header-hero.svg'); print('well-formed')"

      # Push the contents of `dist/` to the `output` branch. After this, files
      # are reachable at:
      #   https://raw.githubusercontent.com/<owner>/<repo>/output/<file>
      # i.e. dist/header-hero.svg becomes .../output/header-hero.svg
      #
      # The `output` branch is shared: activity-composite.yml and
      # featured-from-pins.yml publish there too. The local action clones the
      # existing branch and commits additively (it never deletes their files,
      # never force-pushes), skips the commit when nothing changed (no history
      # churn on every 12-hour run), and rebases and retries when one of them
      # pushed first.
      - name: Push SVGs to the output branch
        uses: ./.github/actions/publish-output
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh snake contribution animation"
          token: ${{ secrets.GITHUB_TOKEN }}
