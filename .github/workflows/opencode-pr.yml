name: Update open-source work section

# Keeps the "Open-source work" section of the README in sync with PUBLIC upstream
# data: the GitHub search API (issues + PRs opened in repositories the owner does
# NOT own) and the unauthenticated api.npmjs.org download counters. Only the text
# between STORY:START/END and FRESH:START/END is regenerated; it commits only when
# something actually changed. No `push` trigger -> no self-trigger loop.
#
# The file name is deliberately unchanged: the run history of a workflow hangs on
# its PATH, not on the `name:` field above (44 runs on
# .github/workflows/opencode-pr.yml as of 2026-07-25), so renaming the file would
# throw that history away for nothing.
#
# TOKEN: the built-in GITHUB_TOKEN, deliberately. It must NEVER be given
# STATS_TOKEN: that token can see private organisation repositories, and the very
# same search query would then return them (measured 2026-07-25: 863 private items
# under a single owner). See the PRIVACY rubric in upstream_story.py.

on:
  schedule:
    - cron: "30 4 * * *"   # daily 04:30 UTC (scheduled runs actually start ~05:20-05:45 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencode-pr
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned to the version CI tests against: production runs what was tested.
          python-version: "3.12"

      - name: Regenerate the Open-source work section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/upstream_story.py

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README unchanged, nothing to commit (idempotent no-op)."
          else
            git add README.md
            git commit -m "chore: refresh open-source work section [skip ci]"
            git push origin HEAD:main
            echo "Open-source work section updated and pushed to main."
          fi
